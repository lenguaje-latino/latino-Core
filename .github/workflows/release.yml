name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: kitware/cmake-build-extension@v2
        with:
          cmake-version: '~3.27.0'

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x86_64

      - name: Verify CMake and Compiler
        run: |
          cmake --version
          gcc --version
          mingw32-make --version

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake with MinGW Makefiles
        run: |
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        shell: cmd

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release -j 4
        shell: cmd

      - name: List build artifacts
        run: |
          echo "Build directory contents:"
          dir /s /b build\
        shell: cmd

      - name: Create NSIS Installer
        run: |
          cd build
          cpack -G NSIS -C Release
        shell: cmd
        continue-on-error: true

      - name: List generated installers
        run: |
          echo "Looking for installers in build directory:"
          dir /s /b build\*.exe
        shell: cmd
        continue-on-error: true

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/*.exe
          retention-days: 30

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f
          ls -lh artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/Windows-Installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
