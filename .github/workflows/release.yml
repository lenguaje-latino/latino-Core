name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install MinGW and CMake
        run: |
          choco install mingw cmake -y
          refreshenv
        shell: powershell

      - name: Verify Tools
        run: |
          cmake --version
          gcc --version
          mingw32-make --version
        shell: bash

      - name: Create build directory
        run: mkdir -p build
        shell: bash

      - name: Configure CMake with MinGW Makefiles
        run: |
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        shell: bash

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release -j 4
        shell: bash

      - name: Check binary exists
        run: |
          echo "Searching for latino executable..."
          find build -name "latino.exe" -o -name "latino" 2>/dev/null | head -10
          ls -lh build/src/ 2>/dev/null || echo "build/src/ not found"
          ls -lh build/ 2>/dev/null | grep -i latino || echo "No latino files in build/"
        shell: bash

      - name: Locate and prepare binary
        run: |
          # Find latino.exe in any subdirectory
          LATINO_BIN=$(find build -name "latino.exe" -type f 2>/dev/null | head -1)
          
          if [ -z "$LATINO_BIN" ]; then
            echo "ERROR: latino.exe not found!"
            find build -type f -name "*.exe" 2>/dev/null
            exit 1
          fi
          
          echo "Found: $LATINO_BIN"
          mkdir -p build/release
          cp "$LATINO_BIN" build/release/latino.exe
          ls -lh build/release/latino.exe
        shell: bash

      - name: Create ZIP package
        run: |
          cd build/release
          mkdir -p Latino-Release
          mv latino.exe Latino-Release/
          cp -r ../../resources Latino-Release/ 2>/dev/null || true
          7z a Latino.zip Latino-Release/
          ls -lh Latino.zip
        shell: bash
        continue-on-error: true

      - name: List artifacts
        run: |
          echo "=== Build artifacts ==="
          find build/release -type f 2>/dev/null || echo "No artifacts in build/release"
          ls -lh build/release/ 2>/dev/null || echo "build/release/ not found"
        shell: bash
        continue-on-error: true

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Binary
          path: build/release/Latino-Release/latino.exe
          retention-days: 30

      - name: Upload Windows Release Package
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release-Package
          path: build/release/Latino.zip
          if-no-files-found: warn
          retention-days: 30

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f
          ls -lh artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Windows-Binary/latino.exe
            artifacts/Windows-Release-Package/Latino.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
