name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x86_64

      - name: Verify Tools
        run: |
          cmake --version
          gcc --version
          mingw32-make --version
        shell: bash

      - name: Create build directory
        run: mkdir -p build
        shell: bash

      - name: Configure CMake with MinGW Makefiles
        run: |
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        shell: bash

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release -j 4
        shell: bash

      - name: Check binary exists
        run: |
          echo "Checking for latino executable..."
          ls -lh build/src/latino.exe || ls -lh build/src/latino || echo "Binary not found"
        shell: bash

      - name: Create NSIS Installer
        run: |
          cd build
          cpack -G NSIS -C Release || echo "NSIS installer creation failed (non-critical)"
        shell: bash
        continue-on-error: true

      - name: List generated files
        run: |
          echo "=== Build artifacts ==="
          find build -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" | head -20
          ls -lh build/*.exe 2>/dev/null || echo "No .exe files in build/"
        shell: bash
        continue-on-error: true

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Binary
          path: build/src/latino.exe
          retention-days: 30

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/*.exe
          if-no-files-found: warn
          retention-days: 30

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f
          ls -lh artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/Windows-Installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
