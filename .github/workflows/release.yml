name: Build Installers

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ -DCMAKE_CONFIGURATION_TYPES=Release
        
      - name: Build
        run: cmake --build build --config Release -j 4
        
      - name: Create Installer
        run: |
          cd build
          cpack -G NSIS -C Release
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies
        run: brew install cmake
        
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: cmake --build build --config Release -j $(sysctl -n hw.ncpu)
        
      - name: Copy libraries to common folder
        run: |
          find build -name "*.a" -o -name "*.dylib" | while read lib; do
            cp "$lib" build/src/
          done
        
      - name: Create Installer
        run: |
          cd build
          cpack -G DragNDrop -C Release
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Installer
          path: build/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential rpm
          
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
        
      - name: Build
        run: cmake --build build --config Release -j $(nproc)
        
      - name: Copy libraries to common folder
        run: |
          find build -name "*.a" -o -name "*.so" | while read lib; do
            cp "$lib" build/src/
          done
        
      - name: Create Installers
        run: |
          cd build
          cpack -G "DEB;RPM" -C Release
          
      - name: Upload Installers
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Installers
          path: |
            build/*.deb
            build/*.rpm

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get Latino Version
        id: version
        run: |
          MAYOR=$(grep -oP '#define LAT_VERSION_MAYOR\s+\K[0-9]+' include/latino.h)
          MENOR=$(grep -oP '#define LAT_VERSION_MENOR\s+\K[0-9]+' include/latino.h)
          PARCHE=$(grep -oP '#define LAT_VERSION_PARCHE\s+\K[0-9]+' include/latino.h)
          VERSION="${MAYOR}.${MENOR}.${PARCHE}.0"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
          
      - name: Determine Release Type
        id: release-type
        run: |
          if [ "$GITHUB_REF" == "refs/heads/dev" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag_name=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
            echo "name=Development Build - ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "prelanzamiento=1" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag_name=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "name=Release v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "prelanzamiento=0" >> $GITHUB_OUTPUT
          fi
          
      - name: Update LAT_VERSION_PRELANZAMIENTO
        run: |
          sed -i "s/#define LAT_VERSION_PRELANZAMIENTO .*/#define LAT_VERSION_PRELANZAMIENTO ${{ steps.release-type.outputs.prelanzamiento }}/" include/latino.h
          cat include/latino.h | grep LAT_VERSION_PRELANZAMIENTO
          
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-type.outputs.tag_name }}
          name: ${{ steps.release-type.outputs.name }}
          files: |
            artifacts/Windows-Installer/*.exe
            artifacts/macOS-Installer/*.dmg
            artifacts/Linux-Installers/*.deb
            artifacts/Linux-Installers/*.rpm
          draft: false
          prerelease: ${{ steps.release-type.outputs.prerelease == 'true' }}
